<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de alumnos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/functions.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <div id="alerta" class="pointer-events-none fixed right-4 top-4 z-50 hidden w-full max-w-sm"></div>
    <main class="mx-auto flex min-h-screen w-full max-w-3xl items-center p-4 sm:p-6">
        <section class="w-full rounded-2xl bg-white p-6 shadow-lg sm:p-8">
            <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Generador de alumnos</h1>
            <p class="mt-2 text-sm text-slate-600">Configura los parámetros y genera tu archivo.</p>

            <div class="mt-6 grid gap-5">
                <div>
                    <label for="registros" class="mb-2 block text-sm font-medium">Número de registros</label>
                    <input
                        type="number"
                        value="1"
                        min="1"
                        max="50000"
                        id="registros"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    >
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button
                            type="button"
                            onclick="document.getElementById('registros').value=1"
                            class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium transition hover:bg-slate-100"
                        >
                            Registros 1
                        </button>
                        <button
                            type="button"
                            onclick="document.getElementById('registros').value=50000"
                            class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium transition hover:bg-slate-100"
                        >
                            Registros 50000
                        </button>
                    </div>
                </div>

                <div>
                    <label for="opcion" class="mb-2 block text-sm font-medium">Tipo de archivo</label>
                    <select
                        id="opcion"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    >
                        <option value="1">SQL MySQL / MariaDB</option>
                        <option value="2">Postgres</option>
                        <option value="3">CSV</option>
                        <option value="4">JSON</option>
                    </select>
                </div>

                <div class="flex flex-wrap gap-3">
                    <button
                        type="button"
                        onclick="generar()"
                        class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"
                    >
                        Generar
                    </button>
                    <button
                        type="button"
                        onclick="guardarArchivo()"
                        class="rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-700"
                    >
                    Guardar Archivo
                    </button>
                </div>
            </div>

            <p id="salida" class="mt-6 whitespace-pre-wrap rounded-lg border border-slate-200 bg-slate-50 p-3 text-sm text-slate-700"></p>
        </section>
    </main>
</body>
</html>
